name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build & publish to PyPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write  # OIDC trust publishing (PyPI trusted publishing)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build sdist + wheel
        run: |
          python -m build

      - name: Verify artifacts
        run: |
          twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Preferred: trusted publishing (no token needed once the
          # PyPI project "stormetric" is linked to this repo).
          # Alternative: set the PYPI_API_TOKEN secret and uncomment:
          # password: ${{ secrets.PYPI_API_TOKEN }}
          # username: __token__
          packages-dir: dist/
